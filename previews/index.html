const images={};let ready=0;const keys=Object.keys(sources);
keys.forEach(k=>{let im=new Image();im.onload=()=>{if(++ready===keys.length) draw()};im.src=sources[k];images[k]=im});
const canvas=document.querySelector('#screen');const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const DAY_BG='#fffaee', NIGHT_BG='#18185a', PLUM='#693160', PINK='#eeaaa5', STAR='#fff6ac';
let state='home', action='walk',f=0,x=76,dir=1,sel=0,ss=0,score=0,tx=80,ty=48;
let hunger=65,happy=75,energy=100,poop=0,pausedUntil=0,miniStart=0,mute=false;
const menu=['Feed','Play','Sleep','Clean','Settings','Exit'];
function spr(name,x,y,flip=false){let im=images[name];if(!im||!im.complete)return;ctx.save();if(flip){ctx.translate(x+im.width,y);ctx.scale(-1,1);ctx.drawImage(im,0,0)}else ctx.drawImage(im,x,y);ctx.restore()}
function txt(t,x,y,size=14,color=PLUM){ctx.fillStyle=color;ctx.font='bold '+size+'px monospace';ctx.fillText(t,x,y)}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
// small star field and crescent moon for sleeping state only
const starDots=[[12,64],[39,91],[63,59],[89,82],[113,69],[145,96],
 [172,62],[230,108],[22,132],[55,155],[98,119],[132,147],
 [183,170],[222,148],[11,184],[70,192],[153,188],
 [214,197],[33,221],[116,215],[190,228]];
function drawSky(){
  for(let i=0;i<starDots.length;i++){
    const [sx,sy]=starDots[i];
    ctx.fillStyle=i%2===0?'#ffffff':STAR;
    ctx.fillRect(sx-1,sy-1,3,3);
  }
  ctx.fillStyle=STAR;
  ctx.beginPath();ctx.arc(204,79,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=NIGHT_BG;
  ctx.beginPath();ctx.arc(210,73,11,0,Math.PI*2);ctx.fill();
}
function draw(){
  const night=state==='home' && action==='sleep';
  const bg=night?NIGHT_BG:DAY_BG;
  const fg=night?STAR:PLUM;
  ctx.clearRect(0,0,240,240);
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,240,240);
  if(night)drawSky();
  txt('Hng:'+hunger+'  Hap:'+happy,8,17,17,fg);
  txt('Energy',8,39,15,fg);
  rr(88,28,144,13,3,bg,fg);
  ctx.fillStyle=night?STAR:PINK;
  ctx.fillRect(91,31,138*energy/100,7);
  ctx.fillStyle=fg;
  ctx.fillRect(0,202,240,1);
  txt('ACTION: MENU',69,236,10,fg);
  if(state==='mini'){
    ctx.fillStyle=DAY_BG;ctx.fillRect(0,0,240,240);
    txt('Score:'+score,8,22,17);
    txt('T:'+Math.max(0,15-Math.floor((Date.now()-miniStart)/1000)),150,22,17);
    ctx.fillStyle=PLUM;ctx.fillRect(0,36,240,1);
    spr('treat_frame',tx,ty);spr('walk_'+f,x,130,dir<0);
    txt('LEFT/RIGHT TO CATCH',32,236,10);
    return;
  }
  if(state==='settings'){
    ctx.fillStyle=DAY_BG;ctx.fillRect(0,0,240,240);
    txt('Settings',33,35,21);
    txt((ss===0?'> ':'  ')+'Sound: '+(mute?'OFF':'ON'),30,108,16);
    txt((ss===1?'> ':'  ')+'Back',30,144,16);
    return;
  }
  if(state==='menu'){
    spr('neutral_original',x,140);
    rr(23,35,194,168,10,'#000','#fff');
    menu.forEach((name,i)=>txt((i===sel?'> ':'  ')+name,43,62+i*27,18,i===sel?'#ffb5d8':'#fff'));
    return;
  }
  spr(action+'_'+f,x,112,dir<0);
  if(action!=='sleep'){
    for(let i=0;i<poop;i++)spr('poop_frame',12+i*23,181);
  }
}
function press(b){if(ready!==keys.length)return;
 if(state==='home'){if(b==='ok'){state='menu';sel=0}}
 else if(state==='menu'){
   if(b==='left')sel=(sel+5)%6;
   else if(b==='right')sel=(sel+1)%6;
   else if(b==='ok'){
    if(sel===0){hunger=Math.min(100,hunger+20);action='eat';pausedUntil=Date.now()+3000;state='home'}
    if(sel===1){state='mini';miniStart=Date.now();tx=80;ty=45;score=0}
    if(sel===2){action=(action==='sleep')?'walk':'sleep';state='home'}
    if(sel===3){if(poop>0){poop=0;happy=Math.min(100,happy+5)}action='walk';pausedUntil=0;state='home'}
    if(sel===4){state='settings';ss=0}
    if(sel===5){state='home'}
   }
 } else if(state==='settings'){
  if(b==='left'||b==='right')ss=1-ss;
  else if(b==='ok'){if(ss===0)mute=!mute;else{state='menu';sel=4}}
 } else if(state==='mini'){
  if(b==='left'){x=Math.max(0,x-16);dir=-1}
  if(b==='right'){x=Math.min(150,x+16);dir=1}
 }
 draw()}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Enter',' '].includes(e.key)){e.preventDefault();press(e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':'ok')}});
setInterval(()=>{if(ready!==keys.length)return;f=(f+1)%4;if(state==='home') {if(pausedUntil&&Date.now()>pausedUntil){pausedUntil=0;action='walk'}if(action==='walk'){x+=dir*3;if(x>=150){x=150;dir=-1}if(x<=0){x=0;dir=1}}}
if(state==='mini'){ty+=4;if(ty>125&&ty<206&&tx+16>x+6&&tx<x+84){score++;tx=10+Math.random()*207;ty=45}else if(ty>225){tx=10+Math.random()*207;ty=45}if(Date.now()-miniStart>15000){state='home';action='play';pausedUntil=Date.now()+3000;happy=Math.min(100,happy+20)}}draw()},150);
// poop appears periodically while the poodle is awake on the home screen
setInterval(()=>{
  if(ready!==keys.length||state!=='home'||action==='sleep')return;
  poop=Math.min(3,poop+1);
  draw();
},300000);
